name: PHP CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        operating-system: [ubuntu-latest]
        php-version: ['8.1', '8.2']
        project-dir:
          - hooks/OpenTelemetry
          - hooks/DDTrace
          - hooks/Validators
          - providers/Flagd
          - providers/Split
          - providers/GoFeatureFlag
          # - providers/CloudBees  # disabled: revert after issue is resolved (#92)
          # - providers/Flagsmith  # not yet wired into CI
      fail-fast: false

    # todo exclude some matrix combinations based on php version requirements
    # https://docs.github.com/en/actions/using-jobs/using-a-matrix-for-your-jobs#excluding-matrix-configurations

    steps:
    - uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
      with:
        php-version: ${{ matrix.php-version }}
        coverage: xdebug
        extensions: ast, grpc, bcmath
    
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14' 

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v6
      with:
        path: ${{ matrix.project-dir }}/vendor
        key: ${{ runner.os }}-${{ matrix.php-version }}-php-${{ hashFiles('**/composer.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.php-version }}-php-

    - name: Install dependencies
      if: steps.composer-cache.outputs.cache-hit != 'true'
      working-directory: ${{ matrix.project-dir }}
      run: composer install --prefer-dist --no-progress --no-suggest

    - name: Validate Packages composer.json
      working-directory: ${{ matrix.project-dir }}
      run: composer validate

    - name: Check Style
      working-directory: ${{ matrix.project-dir }}
      run: vendor/bin/phpcs

    - name: Run Phan
      working-directory: ${{ matrix.project-dir }}
      env:
        PHAN_DISABLE_XDEBUG_WARN: 1
      run: vendor/bin/phan

    - name: Run Psalm
      working-directory: ${{ matrix.project-dir }}
      run: vendor/bin/psalm --output-format=github --php-version=${{ matrix.php-version }}

    - name: Run Phpstan
      working-directory: ${{ matrix.project-dir }}
      run: vendor/bin/phpstan analyse --error-format=github

    - name: Run PHPUnit (unit tests)
      working-directory: ${{ matrix.project-dir }}
      run: |
        composer run dev:test:unit:setup
        vendor/bin/phpunit --coverage-text --coverage-clover=coverage.unit.xml --testsuite unit
        composer run dev:test:unit:teardown

    - name: Run PHPUnit (integration tests)
      working-directory: ${{ matrix.project-dir }}
      run: |
        composer run dev:test:integration:setup
        vendor/bin/phpunit --coverage-text --coverage-clover=coverage.integration.xml --testsuite integration
        composer run dev:test:integration:teardown

    - name: Run e2e suite (Behat)
      if: matrix.php-version == '8.2'
      working-directory: ${{ matrix.project-dir }}
      run: composer run dev:test:e2e

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0

  # Regenerates the flagd protobuf classes from the pinned schema and fails if the committed
  # output is stale, so generated code can't drift from the proto without being noticed.
  proto-drift:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
      with:
        php-version: latest
        coverage: none

    - name: Verify generated protobuf is up to date
      working-directory: providers/Flagd
      run: composer run dev:grpc:verify

