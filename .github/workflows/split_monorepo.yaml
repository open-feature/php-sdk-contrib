name: split-monorepo

# Two modes, selected by the triggering event:
#
#   branch mode: `push` to main, or `workflow_dispatch` from main with `branch`.
#     Filters the selected branch and pushes the result to the same branch
#     of every package's read-only mirror. Never pushes tags.
#
#   tag mode: `release: published`, or `workflow_dispatch` with `tag`.
#     Only the package matching the tag runs. The filtered history is pushed
#     to a bare-version tag (e.g. 1.2.3) on the mirror. Never moves `main`.
on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag mode: package tag (e.g. open-feature/flagd-provider-1.2.3). Leave empty for branch mode.'
        type: string
        required: false
      branch:
        description: 'Branch mode: branch to sync to the mirrors. Run the workflow from main. Leave empty for tag mode.'
        type: string
        required: false
      force:
        description: 'Branch mode: force-push the selected mirror branch. Needed to replace unrelated mirror history.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  split-repositories:
    # Forks do not have the split GitHub App credentials.
    if: github.repository == 'open-feature/php-sdk-contrib'
    runs-on: ubuntu-latest
    # One sync at a time per mirror and ref. Runs queue instead of being
    # cancelled so a push can never be interrupted halfway.
    concurrency:
      group: split-${{ matrix.config[1] }}-${{ matrix.config[0] }}-${{ github.event.release.tag_name || inputs.tag || inputs.branch || 'main' }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # Structure of the config tuple is:
        # 0: Type of package (e.g. open-feature/flagd-*provider*)
        # 1: Name of package (sans-org-prefix e.g. open-feature/*flagd*-provider)
        # 2: Name of subdirectory (e.g. providers/*Flagd*)
        config:
          - [hook, dd-trace, DDTrace]
          - [hook, otel, OpenTelemetry]
          - [hook, validators, Validators]
          - [provider, cloudbees, CloudBees]
          - [provider, flagd, Flagd]
          - [provider, split, Split]
          - [provider, go-feature-flag, GoFeatureFlag]
          - [provider, flagsmith, Flagsmith]
    env:
      TARGET_BRANCH: ${{ inputs.branch || 'main' }}
      PKG_TYPE: ${{ matrix.config[0] }}
      PKG_NAME: ${{ matrix.config[1] }}
      PKG_DIR: ${{ matrix.config[2] }}
    steps:
      - name: Detect run mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          mode=""
          tag=""
          case "$EVENT_NAME" in
            push)
              mode=branch
              ;;
            release)
              mode=tag
              tag="$RELEASE_TAG"
              ;;
            workflow_dispatch)
              if [ -n "$INPUT_TAG" ] && [ -n "$INPUT_BRANCH" ]; then
                echo "::error::Provide exactly one of 'tag' or 'branch', not both."
                exit 1
              elif [ -n "$INPUT_TAG" ]; then
                mode=tag
                tag="$INPUT_TAG"
              elif [ -n "$INPUT_BRANCH" ]; then
                if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                  echo "::error::Run branch mode from main."
                  exit 1
                fi
                git check-ref-format "refs/heads/$INPUT_BRANCH"
                mode=branch
              else
                echo "::error::Provide exactly one of 'tag' or 'branch'."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac

          if [ "$mode" = "tag" ]; then
            prefix="open-feature/${PKG_NAME}-${PKG_TYPE}-"
            if [[ "$tag" == "$prefix"* ]]; then
              echo "target_ref=refs/tags/${tag#"$prefix"}" >> "$GITHUB_OUTPUT"
            else
              mode=skip
            fi
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          echo "Mode for ${PKG_NAME}-${PKG_TYPE}: ${mode}"

      - name: checkout
        id: checkout
        if: ${{ steps.mode.outputs.mode != 'skip' }}
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          git clone "$GITHUB_SERVER_URL"/"$GITHUB_REPOSITORY" "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          if [ "$MODE" = "branch" ] && [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git fetch origin "refs/heads/$TARGET_BRANCH"
            git checkout --detach FETCH_HEAD
          else
            git checkout "$GITHUB_SHA"
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token (tag mode)
        if: ${{ steps.mode.outputs.mode == 'tag' }}
        id: tag-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SPLIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SPLIT_APP_PRIVATE_KEY }}
          owner: open-feature-php
          repositories: ${{ matrix.config[1] }}-${{ matrix.config[0] }}
          permission-contents: write

      - name: Filter and push tag for package ${{ matrix.config[1] }}-${{ matrix.config[0] }}
        if: ${{ steps.mode.outputs.mode == 'tag' }}
        uses: open-feature-php/git-filter-repo-docker-action@7d873fc999440318495b59e9c2a5ddf5505897c3
        with:
          token: ${{ steps.tag-token.outputs.token }}
          targetOrg: open-feature-php
          targetRepo: ${{ matrix.config[1] }}-${{ matrix.config[0] }}
          targetBranch: ${{ steps.mode.outputs.target_ref }}
          tagFilter: ^open-feature/${{ matrix.config[1] }}-
          filterArguments: |
            --subdirectory-filter "${{matrix.config[0] }}s/${{ matrix.config[2] }}/" \
            --tag-rename "open-feature/${{ matrix.config[1] }}-${{ matrix.config[0] }}-:" \
            --force

      # Branch mode is plain git because the action cannot do this: with a
      # branch name it runs a non-force `git push HEAD:<branch>`, so the
      # one-time history rewrite of mirror main would be rejected.
      # The App token is minted after filtering and only exposed to the push
      # step. Everything that installs or runs third-party code (pip,
      # git-filter-repo) runs without any credential in its environment.
      - name: Filter history for package ${{ matrix.config[1] }}-${{ matrix.config[0] }}
        if: ${{ steps.mode.outputs.mode == 'branch' }}
        run: |
          set -euo pipefail
          python3 -m pip install --user 'git-filter-repo==2.47.0'
          export PATH="$HOME/.local/bin:$PATH"

          cd "$GITHUB_WORKSPACE"
          # Tags are never mirrored in branch mode.
          git tag --list | xargs -r git tag --delete
          git checkout -B split HEAD
          git-filter-repo --force --refs refs/heads/split \
            --subdirectory-filter "${PKG_TYPE}s/${PKG_DIR}/"

      # Package histories contain .github/workflows/ files, and GitHub rejects
      # App pushes that create or update workflow files without the
      # `workflows` permission.
      - name: Generate GitHub App token (branch mode)
        if: ${{ steps.mode.outputs.mode == 'branch' }}
        id: branch-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SPLIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SPLIT_APP_PRIVATE_KEY }}
          owner: open-feature-php
          repositories: ${{ matrix.config[1] }}-${{ matrix.config[0] }}
          permission-contents: write
          permission-workflows: write

      - name: Push branch for package ${{ matrix.config[1] }}-${{ matrix.config[0] }}
        if: ${{ steps.mode.outputs.mode == 'branch' }}
        env:
          TARGET_TOKEN: ${{ steps.branch-token.outputs.token }}
          SOURCE_SHA: ${{ steps.checkout.outputs.source_sha }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          force_flag=""
          if [ "${FORCE:-false}" = "true" ]; then
            # Concurrency does not order queued runs. Only force when the
            # source branch has not moved since checkout. Non-force pushes
            # are already protected by git's fast-forward check.
            current_sha="$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/heads/$TARGET_BRANCH" | cut -f1)"
            if [ "$current_sha" != "$SOURCE_SHA" ]; then
              echo "::error::Refusing forced push: $TARGET_BRANCH moved to ${current_sha}, this run checked out ${SOURCE_SHA}. Re-dispatch for the current branch."
              exit 1
            fi
            force_flag="--force"
          fi

          basic="$(printf 'x-access-token:%s' "$TARGET_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$basic"
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0=""
          export GIT_CONFIG_KEY_1="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $basic"

          cd "$GITHUB_WORKSPACE"
          # Same filter on same history gives identical SHAs, so this is a
          # fast-forward (or "Everything up-to-date") after the first sync.
          # shellcheck disable=SC2086
          git push $force_flag "https://github.com/open-feature-php/${PKG_NAME}-${PKG_TYPE}.git" "HEAD:refs/heads/$TARGET_BRANCH"
